# MindsHub Cowork — self-hosted on Dokploy (kiwibot-atlas)
#
# Source: https://github.com/mindsdb/mindshub (fork). The `api` service exposes
# the REST API at :26866/api/v1 (health at /api/v1/health). Consumed via an
# ANTON_MINDS_API_KEY.
#
# Build: docker/api.Dockerfile installs cowork-server from PyPI (pulls
# anton-agent + hermes-agent). No git submodules are needed at build time.
#
# Domain routing on Dokploy: the service joins the external `dokploy-network`
# so Traefik can reach it. In Dokploy → Domains, point the domain to service
# `api`, container port 26866, HTTPS/Let's Encrypt.
#
# Customized over upstream: api-only (web commented), Minds auth env,
# kiwibot-atlas labels, resource limits, restart policy.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      COWORK_SERVER_HOST: "0.0.0.0"
      COWORK_SERVER_PORT: "26866"
      DATABASE_URI: "sqlite:////home/cowork/.cowork/cowork.db"
      # --- Bearer auth (the API is public). /api/v1/health stays exempt. ---
      # Token: set COWORK_AUTH_TOKEN in Dokploy env for a stable known token;
      # if left empty the server auto-generates one into /home/cowork/.cowork/.env.
      COWORK_REQUIRE_AUTH: "true"
      COWORK_AUTH_TOKEN: "${COWORK_AUTH_TOKEN:-}"
      # --- Minds Cloud / MindsHub auth (primary) ---
      ANTON_MINDS_ENABLED: "true"
      ANTON_MINDS_API_KEY: "${ANTON_MINDS_API_KEY:?set ANTON_MINDS_API_KEY in Dokploy env}"
      ANTON_MINDS_URL: "${ANTON_MINDS_URL:-}"           # leave empty to use the Minds cloud default
      # ANTON_MINDS_MIND_NAME: "${ANTON_MINDS_MIND_NAME:-}"
      # --- Optional BYOK overrides (only if NOT using Minds routing) ---
      # ANTON_PLANNING_PROVIDER: "anthropic"
      # ANTON_ANTHROPIC_API_KEY: "${ANTON_ANTHROPIC_API_KEY:-}"
      # ANTON_OPENAI_API_KEY: "${ANTON_OPENAI_API_KEY:-}"
      ANTON_DISABLE_AUTOUPDATES: "true"
      ANTON_ANALYTICS_ENABLED: "false"
    volumes:
      - cowork-data:/home/cowork/.cowork
    ports:
      # Dokploy/Traefik routes the public domain to this container port.
      # Keep published for direct/internal access; remove if only Traefik should reach it.
      - "26866:26866"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:26866/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - dokploy-network
    labels:
      app: "mindshub-cowork"
      service: "cowork-api"
      component: "api"
      team: "data"
      environment: "production"
      managed-by: "data@robot.com"
      repository: "https://github.com/kiwibot-data/mindshub"
      # --- Traefik routing (docker provider reads these from the container) ---
      # Dokploy's Compose type does not auto-inject Traefik labels, so we set
      # them explicitly, matching the proven pattern of other apps on this host.
      traefik.enable: "true"
      traefik.docker.network: "dokploy-network"
      traefik.http.routers.mindshub-cowork-secure.entrypoints: "websecure"
      traefik.http.routers.mindshub-cowork-secure.rule: "Host(`minds.fredhii.com`)"
      traefik.http.routers.mindshub-cowork-secure.tls.certresolver: "letsencrypt"
      traefik.http.routers.mindshub-cowork-web.entrypoints: "web"
      traefik.http.routers.mindshub-cowork-web.middlewares: "redirect-to-https@file"
      traefik.http.routers.mindshub-cowork-web.rule: "Host(`minds.fredhii.com`)"
      traefik.http.services.mindshub-cowork.loadbalancer.server.port: "26866"

  # Optional web SPA (nginx). Only needed if you also want the browser UI.
  # You said the goal is API consumption, so it is disabled by default.
  # web:
  #   build:
  #     context: .
  #     dockerfile: docker/web.Dockerfile
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 512M
  #   labels:
  #     app: "mindshub-cowork"
  #     service: "cowork-web"
  #     component: "frontend"
  #     team: "data"
  #     environment: "production"
  #     managed-by: "data@robot.com"
  #     repository: "https://github.com/mindsdb/minds-platform"

volumes:
  cowork-data:
    driver: local

networks:
  dokploy-network:
    external: true
