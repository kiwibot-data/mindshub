# MindsHub Cowork — self-hosted on Dokploy (kiwibot-atlas)
#
# Source: https://github.com/mindsdb/mindshub (fork). The `api` service exposes
# the REST API at :26866/api/v1 (health at /api/v1/health). Gemini BYOK is the
# production default; Anthropic and Minds Cloud remain rollback providers.
#
# Build: docker/api.Dockerfile installs cowork-server from PyPI (pulls
# anton-agent + hermes-agent). No git submodules are needed at build time.
#
# Domain routing on Dokploy: the service joins the external `dokploy-network`
# so Traefik can reach it. In Dokploy → Domains, point the domain to service
# `api`, container port 26866, HTTPS/Let's Encrypt.
#
# Customized over upstream: api-only (web commented), provider provisioning,
# kiwibot-atlas labels, resource limits, restart policy.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      COWORK_SERVER_HOST: "0.0.0.0"
      COWORK_SERVER_PORT: "26866"
      DATABASE_URI: "sqlite:////home/cowork/.cowork/cowork.db"
      # --- Bearer auth (the API is public). /api/v1/health stays exempt. ---
      # A stable token is required because the provisioner must authenticate.
      COWORK_REQUIRE_AUTH: "true"
      COWORK_AUTH_TOKEN: "${COWORK_AUTH_TOKEN:?set COWORK_AUTH_TOKEN in Dokploy env}"
      # --- Optional Minds Cloud / MindsHub rollback provider ---
      ANTON_MINDS_ENABLED: "true"
      ANTON_MINDS_API_KEY: "${ANTON_MINDS_API_KEY:-}"
      ANTON_MINDS_URL: "${ANTON_MINDS_URL:-}"           # leave empty to use the Minds cloud default
      # ANTON_MINDS_MIND_NAME: "${ANTON_MINDS_MIND_NAME:-}"
      ANTON_DISABLE_AUTOUPDATES: "true"
      ANTON_ANALYTICS_ENABLED: "false"
    volumes:
      - cowork-data:/home/cowork/.cowork
    ports:
      # Dokploy/Traefik routes the public domain to this container port.
      # Keep published for direct/internal access; remove if only Traefik should reach it.
      - "26866:26866"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:26866/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - dokploy-network
      - default
    labels:
      app: "mindshub-cowork"
      service: "cowork-api"
      component: "api"
      team: "data"
      environment: "production"
      managed-by: "data@robot.com"
      repository: "https://github.com/kiwibot-data/mindshub"
      # --- Traefik routing (docker provider reads these from the container) ---
      # Dokploy's Compose type does not auto-inject Traefik labels, so we set
      # them explicitly, matching the proven pattern of other apps on this host.
      traefik.enable: "true"
      traefik.docker.network: "dokploy-network"
      traefik.http.routers.mindshub-cowork-secure.entrypoints: "websecure"
      traefik.http.routers.mindshub-cowork-secure.rule: "Host(`minds.fredhii.com`)"
      traefik.http.routers.mindshub-cowork-secure.tls.certresolver: "letsencrypt"
      traefik.http.routers.mindshub-cowork-web.entrypoints: "web"
      traefik.http.routers.mindshub-cowork-web.middlewares: "redirect-to-https@file"
      traefik.http.routers.mindshub-cowork-web.rule: "Host(`minds.fredhii.com`)"
      traefik.http.services.mindshub-cowork.loadbalancer.server.port: "26866"

  # One-shot provisioner: after the API is healthy, it writes the LLM provider
  # settings into the server DB (which lives in the volume, NOT in git). This
  # makes provider config reproducible on every deploy / fresh volume.
  # BYOK credentials are read from Compose secrets so they never enter Git, the
  # Compose environment, or the curl process arguments. Provider/model env vars
  # keep rollback explicit without changing this file.
  provisioner:
    image: curlimages/curl:8.11.1
    depends_on:
      api:
        condition: service_healthy
    environment:
      ANTON_MINDS_API_KEY: "${ANTON_MINDS_API_KEY:-}"
      ANTON_PLANNING_PROVIDER: "${ANTON_PLANNING_PROVIDER:-gemini}"
      ANTON_CODING_PROVIDER: "${ANTON_CODING_PROVIDER:-gemini}"
      # Empty model values are resolved below according to each provider so a
      # Minds Cloud rollback never receives Anthropic-specific model IDs.
      ANTON_PLANNING_MODEL: "${ANTON_PLANNING_MODEL:-}"
      ANTON_CODING_MODEL: "${ANTON_CODING_MODEL:-}"
      COWORK_AUTH_TOKEN: "${COWORK_AUTH_TOKEN:?set COWORK_AUTH_TOKEN in Dokploy env}"
    secrets:
      - cowork_anthropic_api_key
      - cowork_gemini_api_key
    # curlimages/curl runs as a non-root user, while the host secret is
    # intentionally root:root 0600. Run this one-shot container as root with no
    # capabilities and no privilege escalation so it can only read the mount.
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        A=http://api:26866/api/v1/settings
        H_AUTH="Authorization: Bearer $$COWORK_AUTH_TOKEN"
        H_CT="Content-Type: application/json"
        ANTHROPIC_API_KEY="$$(cat /run/secrets/cowork_anthropic_api_key 2>/dev/null || true)"
        GEMINI_API_KEY="$$(cat /run/secrets/cowork_gemini_api_key 2>/dev/null || true)"

        for provider in "$$ANTON_PLANNING_PROVIDER" "$$ANTON_CODING_PROVIDER"; do
          case "$$provider" in
            anthropic|gemini|minds_cloud) ;;
            *) echo "ERROR provisioning: unsupported provider $$provider" >&2; exit 1 ;;
          esac
        done

        if [ -z "$$ANTON_PLANNING_MODEL" ]; then
          case "$$ANTON_PLANNING_PROVIDER" in
            anthropic) ANTON_PLANNING_MODEL=claude-sonnet-5 ;;
            gemini) ANTON_PLANNING_MODEL=gemini-2.5-flash ;;
            minds_cloud) ANTON_PLANNING_MODEL=sonnet ;;
          esac
        fi

        if [ -z "$$ANTON_CODING_MODEL" ]; then
          case "$$ANTON_CODING_PROVIDER" in
            anthropic) ANTON_CODING_MODEL=claude-haiku-4-5-20251001 ;;
            gemini) ANTON_CODING_MODEL=gemini-2.5-flash ;;
            minds_cloud) ANTON_CODING_MODEL=haiku ;;
          esac
        fi

        put_setting() {
          key="$$1"
          value="$$2"
          printf '{"value":"%s"}' "$$value" |
            curl -fsS -X PUT "$$A/$$key" -H "$$H_AUTH" -H "$$H_CT" --data-binary @- >/dev/null
        }

        provider_requires() {
          [ "$$ANTON_PLANNING_PROVIDER" = "$$1" ] || [ "$$ANTON_CODING_PROVIDER" = "$$1" ]
        }

        if provider_requires anthropic; then
          if [ -z "$$ANTHROPIC_API_KEY" ]; then
            echo "ERROR provisioning: Anthropic provider selected but secret is empty" >&2; exit 1
          fi
          put_setting anthropic_api_key "$$ANTHROPIC_API_KEY"
        fi

        if provider_requires gemini; then
          if [ -z "$$GEMINI_API_KEY" ]; then
            echo "ERROR provisioning: Gemini provider selected but secret is empty" >&2; exit 1
          fi
          put_setting gemini_api_key "$$GEMINI_API_KEY"
        fi

        if provider_requires minds_cloud; then
          if [ -z "$$ANTON_MINDS_API_KEY" ]; then
            echo "ERROR provisioning: Minds Cloud provider selected but ANTON_MINDS_API_KEY is empty" >&2; exit 1
          fi
          put_setting minds_api_key "$$ANTON_MINDS_API_KEY"
        fi

        put_setting planning_provider "$$ANTON_PLANNING_PROVIDER"
        put_setting coding_provider "$$ANTON_CODING_PROVIDER"
        put_setting planning_model "$$ANTON_PLANNING_MODEL"
        put_setting coding_model "$$ANTON_CODING_MODEL"
        echo "provisioned: planning=$$ANTON_PLANNING_PROVIDER/$$ANTON_PLANNING_MODEL coding=$$ANTON_CODING_PROVIDER/$$ANTON_CODING_MODEL"
    restart: "on-failure:3"
    networks:
      - default
    labels:
      app: "mindshub-cowork"
      service: "cowork-provisioner"
      component: "init"
      team: "data"
      environment: "production"
      managed-by: "data@robot.com"

  # Optional web SPA (nginx). Only needed if you also want the browser UI.
  # You said the goal is API consumption, so it is disabled by default.
  # web:
  #   build:
  #     context: .
  #     dockerfile: docker/web.Dockerfile
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 512M
  #   labels:
  #     app: "mindshub-cowork"
  #     service: "cowork-web"
  #     component: "frontend"
  #     team: "data"
  #     environment: "production"
  #     managed-by: "data@robot.com"
  #     repository: "https://github.com/mindsdb/minds-platform"

volumes:
  cowork-data:
    driver: local

secrets:
  cowork_anthropic_api_key:
    file: "${ANTON_ANTHROPIC_API_KEY_FILE:-/etc/dokploy/secrets/mindshub/anthropic_api_key}"
  cowork_gemini_api_key:
    file: "${ANTON_GEMINI_API_KEY_FILE:-/etc/dokploy/secrets/mindshub/gemini_api_key}"

networks:
  dokploy-network:
    external: true
  default:
    driver: bridge
